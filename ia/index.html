<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>IA Águia Primordial · funciona sem internet</title>
<meta name="description" content="Pergunte à Águia Primordial: ela responde sobre o site, os temas, as aulas e as palavras em inglês. Sem internet, sem crédito, sem limite.">
<meta name="theme-color" content="#02040d">
<link rel="icon" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preload" href="img/aguia.webp" as="image">
<link rel="stylesheet" href="ia.css">
</head>
<body>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="nebulosa" aria-hidden="true"></div>

<header class="topo">
  <a class="voltar" href="../" aria-label="Voltar ao site">←</a>
  <div class="titulo"><b>ÁGUIA PRIMORDIAL</b><small id="estado">IA local · funciona sem internet</small></div>
  <button class="b-vozes" id="b-vozes" type="button" aria-haspopup="true" aria-expanded="false">🎙️ <span id="voz-nome">Águia</span></button>
</header>
<div class="menu-vozes" id="menu-vozes" hidden role="menu" aria-label="Escolha a voz">
  <button role="menuitemradio" data-voz="aguia" aria-checked="true"><b>Águia</b><small>a voz da Águia Primordial</small></button>
  <button role="menuitemradio" data-voz="aurora" aria-checked="false"><b>Aurora</b><small>apresentadora do podcast Sol Nascente</small></button>
  <button role="menuitemradio" data-voz="solar" aria-checked="false"><b>Conhecimento Solar</b><small>o apresentador do app Conhecimento Solar</small></button>
  <button class="baixar" id="b-baixar" type="button">⬇ Guardar as vozes para usar sem internet</button>
</div>

<main class="cena" id="cena">
  <div class="orbita" id="orbita" aria-hidden="true"></div>
  <button class="aguia" id="aguia" type="button" aria-label="Tocar na Águia para ouvir">
    <span class="anel a1"></span><span class="anel a2"></span><span class="anel a3"></span>
    <span class="halo"></span>
    <img class="ave brilho" src="img/aguia.webp" alt="" width="900" height="900" aria-hidden="true">
    <img class="ave" src="img/aguia.webp" alt="A Águia Primordial, branca como a neve" width="900" height="900">
    <span class="onda" id="onda"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </button>
</main>

<section class="painel" id="painel" aria-live="polite">
  <div class="resposta" id="resposta">
    <p class="fala" id="fala">Olá. Eu sou a Águia Primordial, a guia deste site. Pergunte sobre as aulas, os temas, ou como se diz uma palavra em inglês.</p>
    <div class="fontes" id="fontes"></div>
  </div>
  <div class="sugestoes" id="sugestoes"></div>
  <form class="pergunta" id="form" autocomplete="off">
    <input id="q" type="text" enterkeyhint="send" placeholder="Pergunte à Águia…" aria-label="Sua pergunta">
    <button type="button" id="b-mic" class="mic" aria-label="Falar a pergunta" hidden>🎤</button>
    <button type="submit" class="enviar" aria-label="Enviar">➤</button>
  </form>
</section>
<script src="ia.js" defer></script>
</body>
</html>
